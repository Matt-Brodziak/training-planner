<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training Planner</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell (standalone) - Today and Week are the phone-first views (bottom tab bar under 760px);  — violet top bar, then one scrolling work area per view; calendar = 7 day columns + weekly totals column */
:root{
  --marsh:#FBF8FC; --surface:#FFFFFF; --sunk:#F3EEF7; --line:#E5DEEC; --line-2:#D4CADF;
  --ink:#221836; --muted:#6C6283; --faint:#9A90AE;
  --violet:#4A2C8A; --violet-ink:#3A2170; --violet-soft:#EEE8F8;
  --pink:#F27BAE; --pink-ink:#B83C74; --pink-soft:#FDE8F1;
  --bar:#FFFFFF; --bar-ink:#3A2170; --bar-muted:#8A80A0;
  --run:#E2572F; --bike:#178F7C; --swim:#2B78C9; --strength:#B27A12; --other:#7D6F9C;
  --shadow:0 1px 2px rgba(34,24,54,.06),0 4px 14px rgba(34,24,54,.06);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:6px;
  --good:#178F5A; --fair:#B27A12; --poor:#C93A62;
  --st-deep:#3A2170; --st-light:#B9A6E8; --st-rem:#F27BAE; --st-awake:#DCD3E6; --sleep-bar:#CDBFEA;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--marsh);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.topbar{background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;height:56px;flex:none;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.01em;display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand-mark{width:22px;height:22px;border-radius:5px;background:var(--pink);display:grid;place-items:center}
.brand-mark svg{width:14px;height:14px;stroke:#3A2170}
.brand .word{color:var(--violet)}
.nav{display:flex;gap:2px;height:100%}
.nav a{display:flex;align-items:center;padding:0 14px;color:var(--bar-muted);text-decoration:none;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.03em;text-transform:uppercase;border-bottom:3px solid transparent;margin-bottom:-0px}
.nav a:hover{color:var(--bar-ink);background:var(--violet-soft)}
.nav a[aria-current="page"]{color:var(--bar-ink);border-bottom-color:var(--pink)}
.topbar .spacer{flex:1}
.save-state{font-size:12px;color:var(--bar-muted);white-space:nowrap}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.tb-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tb-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-right:2px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:6px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--violet);color:var(--violet)}
.btn.primary{background:var(--violet);border-color:var(--violet);color:var(--marsh)}
.btn.primary:hover{filter:brightness(1.08);color:var(--marsh)}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#3A1030}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--pink-ink)}
.btn.danger.armed{background:var(--pink-ink);border-color:var(--pink-ink);color:#fff}
.btn svg{width:14px;height:14px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 11px 4px 9px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;color:var(--muted)}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);background:var(--sunk)}
.chip[aria-pressed="false"] .dot{opacity:.35}
select.sel,input.inp{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:6px 9px;font-size:13px}

main{flex:1;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column}

/* calendar */
.cal-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.cal{min-width:1040px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr)) 196px}
.cal-head{position:sticky;top:0;z-index:5;background:var(--marsh);border-bottom:1px solid var(--line-2)}
.cal-head div{padding:10px 10px 8px;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cal-head div:last-child{padding-left:14px}
.week{border-bottom:1px solid var(--line)}
.week.this-week .day{background:color-mix(in srgb,var(--violet-soft) 45%,var(--surface))}
.day{background:var(--surface);border-right:1px solid var(--line);min-height:132px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:5px;position:relative;transition:background .12s}
.day:first-child{border-left:1px solid var(--line)}
.day.past{background:var(--sunk)}
.week.this-week .day.past{background:color-mix(in srgb,var(--violet-soft) 30%,var(--sunk))}
.day.drop{background:var(--pink-soft)!important;box-shadow:inset 0 0 0 2px var(--pink)}
.day-num{display:flex;align-items:baseline;gap:6px;font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--muted);padding:0 2px;min-height:22px}
.day-num .m{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--violet);font-weight:700}
.day.today .day-num .n{background:var(--violet);color:var(--marsh);border-radius:4px;padding:0 6px}
.day-add{margin-top:auto;align-self:stretch;border:1px dashed transparent;background:none;border-radius:var(--r);padding:3px;color:var(--faint);display:flex;justify-content:center;opacity:0;transition:opacity .12s}
.day:hover .day-add,.day-add:focus-visible{opacity:1;border-color:var(--line-2)}
.day-add:hover{color:var(--violet);border-color:var(--violet)}
.day-add svg{width:14px;height:14px}
@media (hover:none){.day-add{opacity:.6}}

.card{background:var(--surface);border:1px solid var(--line-2);border-radius:5px;padding:5px 7px 6px;cursor:pointer;box-shadow:0 1px 1px rgba(34,24,54,.04);user-select:none;text-align:left;width:100%;display:block}
.card:hover{border-color:var(--violet);box-shadow:var(--shadow)}
.card.dragging{opacity:.4}
.card-top{display:flex;align-items:center;gap:5px;font-family:var(--f-display);font-weight:700;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase}
.card-top svg{width:13px;height:13px;flex:none}
.card-top .gap{flex:1}
.card-top .notes-ic{color:var(--faint);display:grid;place-items:center;border-radius:3px;padding:1px}
.card-top .notes-ic:hover{color:var(--violet);background:var(--violet-soft)}
.card-top .plan-dot{width:7px;height:7px;border-radius:50%;flex:none}
.card-title{font-weight:600;font-size:13px;line-height:1.25;margin-top:2px;color:var(--ink);overflow-wrap:anywhere}
.card-dist{font-family:var(--f-display);font-weight:600;font-size:13.5px;color:var(--muted);margin-top:1px}
.card.race{background:var(--pink-soft);border-color:var(--pink)}
.card.race .card-dist{color:var(--pink-ink)}
.card.race .flag{color:var(--pink-ink)}

.wsum{padding:10px 4px 10px 14px;display:flex;flex-direction:column;gap:6px;background:var(--marsh)}
.ws-head{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.ws-total{display:flex;align-items:baseline;gap:10px;font-family:var(--f-display)}
.ws-total b{font-size:22px;font-weight:700;color:var(--ink);line-height:1}
.ws-total span{font-size:14px;color:var(--muted);font-weight:600}
.ws-rows{display:flex;flex-direction:column;gap:3px;margin-top:2px}
.ws-row{display:grid;grid-template-columns:16px 1fr auto;gap:7px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.ws-row svg{width:13px;height:13px}
.ws-row .t{font-weight:600}
.ws-row .d{color:var(--muted);text-align:right}
.ws-empty{font-size:12.5px;color:var(--faint)}
.ws-race{font-size:12px;color:var(--pink-ink);font-weight:600;display:flex;gap:5px;align-items:center}
.ws-race svg{width:12px;height:12px}
.cal-note{text-align:center;color:var(--faint);font-size:12.5px;padding:14px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,12,36,.42);z-index:50;display:flex;align-items:flex-start;justify-content:center;
  padding-top:max(6vh,env(safe-area-inset-top,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));overflow:auto}
.modal{background:var(--surface);border-radius:10px;box-shadow:0 20px 60px rgba(20,12,36,.35);width:min(560px,100%);display:flex;flex-direction:column;max-height:88vh;margin-bottom:24px}
.m-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.m-head h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.01em;flex:1;text-wrap:balance}
.m-head .sub{font-size:13px;color:var(--muted);font-weight:500}
.m-body{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.m-foot{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.m-foot .gap{flex:1}
.x{border:0;background:none;color:var(--muted);padding:4px;border-radius:4px;display:grid}
.x:hover{background:var(--sunk);color:var(--ink)}
.x svg{width:18px;height:18px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:8px 10px;font-size:14px;width:100%}
.field textarea{min-height:120px;resize:vertical;line-height:1.5}
.field .hint{font-size:12px;color:var(--faint)}
.disc-pick{display:flex;gap:6px;flex-wrap:wrap}
.disc-pick button{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:6px 10px;display:flex;gap:6px;align-items:center;font-weight:600;font-size:13px}
.disc-pick button svg{width:14px;height:14px}
.disc-pick button[aria-pressed="true"]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor;background:var(--sunk)}
.race-box{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:var(--r);background:var(--sunk)}
.race-box.on{background:var(--pink-soft)}
.toggle{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.toggle input{width:16px;height:16px;accent-color:var(--pink)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;font-weight:600;font-size:13px;border-left:1px solid var(--line-2)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--violet);color:var(--marsh)}
.err{color:var(--pink-ink);font-size:13px;font-weight:600}

.lib-pick-top{display:flex;gap:8px;flex-wrap:wrap}
.lib-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lib-item{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border:0;border-top:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.lib-item:first-child{border-top:0}
.lib-item:hover{background:var(--sunk)}
.lib-item svg{width:15px;height:15px}
.lib-item .t{font-weight:600}
.lib-item .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-item .meta{font-family:var(--f-display);font-weight:600;color:var(--muted);text-align:right;font-size:13.5px;white-space:nowrap}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13.5px}

/* pages */
.page{flex:1;min-height:0;overflow:auto}
.page-in{max-width:1180px;margin:0 auto;padding-block:22px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.page h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.005em}
.page h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;min-width:0}
.filters{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.kpi{padding:14px 18px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi .l{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:16px;color:var(--muted);font-weight:600;margin-left:3px}
.kpi .s{font-size:12.5px;color:var(--faint);margin-top:2px}
.kpi.pinkv .v{color:var(--pink-ink)}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line-2)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right}
.tbl tr:last-child td{border-bottom:0}
.tbl .dn{display:flex;gap:8px;align-items:center;font-weight:600}
.tbl .dn svg{width:15px;height:15px}
.share{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.share .b{width:70px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.share .b i{display:block;height:100%}
.chart-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:block}
.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block;width:100%;min-width:560px;height:auto}
.chart-wrap text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .date{font-family:var(--f-display);font-weight:700;text-align:center;line-height:1;width:42px}
.li .date b{display:block;font-size:20px}
.li .date span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.li .t{font-weight:600;overflow-wrap:anywhere}
.li .s{font-size:12.5px;color:var(--muted)}
.prio{font-family:var(--f-display);font-weight:700;font-size:12px;border-radius:4px;padding:2px 7px;background:var(--pink-soft);color:var(--pink-ink);border:1px solid var(--pink)}
.prio.A{background:var(--pink);color:#3A1030}

.lib-groups{display:flex;flex-direction:column;gap:22px}
.lib-group h3{margin:0 0 8px;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.07em;text-transform:uppercase}
.lib-group h3 svg{width:16px;height:16px}
.lib-group h3 .c{color:var(--faint);font-weight:600}
.lib-table{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.lrow{display:grid;grid-template-columns:minmax(0,1.3fr) 74px 84px minmax(0,2fr) auto;gap:14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .t{font-weight:600;display:flex;gap:7px;align-items:center;min-width:0}
.lrow .t svg{width:13px;height:13px;color:var(--pink-ink);flex:none}
.lrow .n{font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.lrow .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .acts{display:flex;gap:4px}

.plans-list{display:flex;flex-direction:column;gap:10px}
.plan-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r)}
.plan-row input{border:1px solid var(--line-2);border-radius:var(--r);padding:6px 9px;background:var(--surface);min-width:0;font-weight:600}
.swatches{display:flex;gap:4px}
.swatches button{width:18px;height:18px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-2);padding:0}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.plan-row .cnt{font-size:12.5px;color:var(--muted);grid-column:1/-1}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--marsh);padding:9px 16px;border-radius:6px;font-weight:600;font-size:13.5px;z-index:80;box-shadow:var(--shadow)}

@media (max-width:860px){
  .dash-grid{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .lrow{grid-template-columns:minmax(0,1fr) auto auto;}
  .lrow .s{display:none}
  .lrow .acts{grid-column:1/-1}
}
@media (max-width:560px){
  .topbar{gap:12px}
  .brand .word{display:none}
  .save-state{display:none}
  .nav a{padding:0 10px;font-size:14px}
  .fields{grid-template-columns:1fr}
  .kpi .v{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* base reset (standalone) */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
.icon-btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);width:34px;height:34px;display:grid;place-items:center;color:var(--violet);flex:none}
.icon-btn:hover{border-color:var(--violet)}
.icon-btn svg{width:17px;height:17px}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:default}
.nav{overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}

/* sign-in */
.signin{flex:1;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.signin-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:32px 28px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.signin-card h1{margin:0;font-family:var(--f-display);font-size:30px;color:var(--violet)}
.signin-card p{margin:0;color:var(--muted)}

/* today + week: phone-first, one column */
.day-page{max-width:640px;margin:0 auto;padding-block:18px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.dp-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--pink-ink)}
.dp-head h1{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:36px;line-height:1;color:var(--violet)}
.dp-meta{font-size:13px;color:var(--muted);font-weight:600;text-align:right;padding-bottom:2px}
.countdown{display:flex;gap:10px;align-items:center;background:var(--pink-soft);border:1px solid var(--pink);border-radius:8px;padding:8px 14px;color:var(--ink);font-size:13.5px;max-width:100%}
.countdown .flag{color:var(--pink-ink);width:18px;height:18px;display:grid}
.countdown b{font-family:var(--f-display);font-size:22px;color:var(--pink-ink);margin-right:3px}
.countdown span{font-weight:600}
.hp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px 12px;min-width:0}
.hp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;min-height:28px}
.hp-head h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hp-sub{font-size:13px;color:var(--muted);font-weight:600}
.h-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;padding-top:6px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
.sub{font-size:13px;color:var(--muted)}
.set{display:flex;flex-direction:column;gap:8px}
/* workout card (unchanged) */
.tw-list{display:flex;flex-direction:column;gap:10px}
.tw{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:12px 14px}
.tw:hover{border-color:var(--violet)}
.tw.race{background:var(--pink-soft);border-color:var(--pink)}
.tw-top{display:flex;align-items:center;gap:7px}
.tw-ic{width:18px;height:18px;display:grid}
.tw-disc{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.tw-top .gap{flex:1}
.tw-plan{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
.tw-plan i{width:8px;height:8px;border-radius:50%;display:block}
.tw-title{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.15;margin-top:4px;overflow-wrap:anywhere}
.tw-stats{display:flex;gap:22px;margin-top:6px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tw-stats b{display:block;font-family:var(--f-display);font-size:22px;color:var(--ink);letter-spacing:0;text-transform:none}
.tw-notes{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-2);white-space:pre-wrap;line-height:1.5;font-size:14px;color:var(--ink)}
.rest{display:flex;flex-direction:column;gap:3px;padding:6px 0 4px}
.rest b{font-family:var(--f-display);font-size:24px;color:var(--violet)}
.rest span{color:var(--muted)}
/* readiness */
.rd-top{display:grid;grid-template-columns:140px minmax(0,1fr);gap:14px;align-items:center}
.gauge{width:140px;height:auto;display:block}
.gauge .gv{font-family:var(--f-display);font-weight:700;font-size:42px;fill:var(--ink)}
.rd-band{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.rd-tip{font-size:14.5px;line-height:1.4;margin-top:4px;color:var(--ink)}
.rd-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 20px;margin-top:14px}
.rd-c.wide{grid-column:1/-1}
.rd-c .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px;color:var(--muted)}
.rd-c .row b{color:var(--ink);font-weight:600;white-space:nowrap}
.rd-c .row span{white-space:nowrap}
@media (max-width:380px){ .rd-grid{column-gap:14px} .rd-c .row{font-size:12.5px;gap:6px} }
.bar{height:6px;border-radius:3px;background:var(--sunk);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.rd-note{font-size:12.5px;color:var(--faint);margin-top:10px}
/* weather */
.wx-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wx-now{display:flex;gap:8px;align-items:center;min-width:0}
.wx-ic{width:38px;height:38px;flex:none}
.wx-temp{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;white-space:nowrap}
.wx-cond{font-size:13.5px;color:var(--muted);margin-top:2px}
.compass{width:58px;height:58px;flex:none;display:block}
.compass text{font-family:var(--f-body);font-size:10px;font-weight:600;fill:var(--muted)}
.wx-wind{text-align:right;min-width:0}
.wx-wind b{display:block;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;white-space:nowrap}
.wx-wind .sub{margin-top:2px}
.wx-hours{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:14px;padding-top:12px;border-top:1px solid var(--line);text-align:center}
.wx-h .t{font-size:12px;color:var(--muted);font-weight:600}
.wx-h b{display:block;font-family:var(--f-display);font-size:19px;margin-top:2px}
.wx-arrow{display:block;width:15px;height:15px;margin:5px auto 3px;color:var(--swim)}
.wx-arrow svg{width:100%;height:100%;display:block}
.wx-h .w{font-size:12.5px;color:var(--muted)}
/* week */
.wk-nav{display:flex;gap:8px;align-items:center}
.icon-btn.lg{width:44px;height:44px}
.wk-stats{display:flex;flex-wrap:wrap;gap:8px 28px}
.wk-stats b{display:block;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1;color:var(--ink)}
.wk-stats span{font-size:13px;color:var(--muted)}
.wk-chart{width:100%;height:auto;display:block;margin:14px 0 8px}
.wk-chart text{font-family:var(--f-body);font-size:12px;fill:var(--muted)}
.wk-chart text.today{fill:var(--violet);font-weight:700}
.sl-rows{display:flex;flex-direction:column;gap:9px}
.sl-row{display:grid;grid-template-columns:34px minmax(0,1fr) 44px;gap:12px;align-items:center;font-size:13.5px}
.sl-row .d{color:var(--muted)}
.sl-row.today .d{color:var(--violet);font-weight:700}
.sl-row .bar{margin:0;height:8px;border-radius:4px}
.sl-row .bar i{background:var(--sleep-bar);border-radius:4px}
.sl-row.today .bar i{background:var(--violet)}
.sl-row .v{text-align:right}
.rw-list{display:flex;flex-direction:column}
.rw{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:44px;border:0;border-top:1px solid var(--line);background:none;padding:6px 0;text-align:left;width:100%}
.rw:first-child{border-top:0}
.rw svg{width:15px;height:15px;display:block}
.rw .t{font-weight:600;overflow-wrap:anywhere}
.rw .m{font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap}
/* bottom tab bar: phones only */
.tabbar{display:none}
@media (max-width:560px){ .topbar{gap:8px} .brand{display:none} .nav a{padding:0 7px;font-size:13px;letter-spacing:.02em} .tw-title{font-size:22px} }
@media (max-width:760px){
  .topbar .nav{display:none}
  .brand{display:flex} .brand .word{display:inline}
  body{padding-bottom:0}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));flex:none;background:var(--bar);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--bar-muted);text-decoration:none;font-size:11px;font-weight:600;letter-spacing:.01em}
  .tabbar svg{width:24px;height:24px}
  .tabbar a[aria-current="page"]{color:var(--violet)}
  .tabbar a[aria-current="page"] span{font-weight:700}
  .toast{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  .icon-btn{width:44px;height:44px}
  .day-page .btn{min-height:44px}
  .day-page .btn.sm{min-height:44px;padding-inline:12px}
}
@media (max-width:360px){ .rd-top{grid-template-columns:120px minmax(0,1fr)} .gauge{width:120px} .wx-temp,.wx-wind b{font-size:22px} }
</style>
</head>
<body>
<div id="app" hidden>
<header class="topbar">
  <div class="brand"><span class="brand-mark"><svg viewBox="0 0 16 16" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 11l4-5 3 3 5-6"/></svg></span><span class="word">Training Planner</span></div>
  <nav class="nav" aria-label="Main">

</header>

<main>
  <section class="view" id="view-today" hidden>
    <div class="page"><div class="day-page" id="today"></div></div>
  </section>

  <section class="view" id="view-week" hidden>
    <div class="page"><div class="day-page" id="week"></div></div>
  </section>

  <section class="view" id="view-calendar">
    <div class="toolbar">
      <button class="btn primary" id="btnToday">Today</button>
      <div class="tb-group" id="planChips"><span class="tb-label">Showing</span></div>
      <div class="tb-group" style="margin-left:auto">

        <button class="btn" id="btnPlans"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4h10M3 8h10M3 12h6"/></svg>Plans</button>
      </div>
    </div>
    <div class="cal-scroll" id="calScroll">
      <div class="cal">
        <div class="cal-grid cal-head"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div><div>Week totals</div></div>
        <div id="weeks"></div>
      </div>
    </div>
  </section>

  <section class="view" id="view-dashboard" hidden>
    <div class="page"><div class="page-in" id="dash"></div></div>
  </section>

  <section class="view" id="view-library" hidden>
    <div class="page"><div class="page-in" id="lib"></div></div>
  </section>
</main>

<nav class="tabbar" aria-label="Main">
  <a href="#today" data-view="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg><span>Today</span></a>
  <a href="#week" data-view="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 20.5h18M6.5 17v-5M10.5 17V7M14.5 17v-7M18.5 17V4.5"/></svg><span>Week</span></a>
  <a href="#calendar" data-view="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Calendar</span></a>
  <a href="#dashboard" data-view="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 16.5a8.5 8.5 0 0 1 17 0"/><path d="M12 16.5l4-5"/><path d="M3.5 20.5h17"/></svg><span>Dashboard</span></a>
  <a href="#library" data-view="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="4" y="4" width="6" height="16.5" rx="1.5"/><rect x="14" y="4" width="6" height="16.5" rx="1.5"/></svg><span>Library</span></a>
</nav>

</div>

<div class="signin" id="signin" hidden>
  <div class="signin-card">
    <span class="brand-mark" style="width:36px;height:36px;border-radius:8px"><svg viewBox="0 0 16 16" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;stroke:#3A2170"><path d="M2 11l4-5 3 3 5-6"/></svg></span>
    <h1>Training Planner</h1>
    <p>Sign in with the Google account you use for this planner.</p>
    <button class="btn primary" id="btnSignIn" style="justify-content:center;padding:10px 14px;font-size:14px">Sign in with Google</button>
    <div class="err" id="authErr" hidden></div>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast" hidden></div>

const fmtDur = m => { m=Math.round(+m||0); return Math.floor(m/60)+':'+pad(m%60); };
const fmtKm = (km,disc) => { km=+km||0; if(disc==='swim') return Math.round(km*1000).toLocaleString('en-ZA').replace(/ /g,' ')+' m'; return (km>=100?km.toFixed(0):km.toFixed(1))+' km'; };
const fmtDate = s => { const d=parse(s); return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; };
const parseDur = v => { v=String(v||'').trim(); if(!v) return 0; if(v.includes(':')){ const p=v.split(':').map(x=>parseInt(x,10)||0); return p.length===3? p[0]*60+p[1]+Math.round(p[2]/60) : p[0]*60+p[1]; } const n=parseFloat(v); return isNaN(n)?NaN:Math.round(n); };
const lsGet = (k,def) => { try{ const v=localStorage.getItem('tp:'+k); return v==null?def:JSON.parse(v);}catch(e){ return def; } };
const lsSet = (k,v) => { try{ localStorage.setItem('tp:'+k,JSON.stringify(v)); }catch(e){} };

/* ---------- state ---------- */
const S = {plans:{},library:{},workouts:{}};
const UI = {
  hidden: lsGet('hidden',[]),
  activePlan: lsGet('activePlan','base'),
  dashPlans: lsGet('dashPlans',[]),
  dashRange: lsGet('dashRange','next12'),
  dashFrom: lsGet('dashFrom',''),
  dashTo: lsGet('dashTo',''),
  dashMetric: 'time',
  libFilter:'all', libSearch:'',
  weekStart:null // Week tab: Monday shown (null = this week)
};

function plans(){
  const list = Object.values(S.plans).filter(p=>p.id!=='base').sort((a,b)=>(a.created||0)-(b.created||0));
  const base = S.plans.base ? {...BASE,...S.plans.base} : BASE;
  return [base,...list];
}
const planById = id => plans().find(p=>p.id===id) || plans()[0];
const visible = w => !UI.hidden.includes(w.plan||'base') && plans().some(p=>p.id===(w.plan||'base'));

/* ---------- storage (Firebase) ---------- */
let user = null, unsubs = [];
const SL = {sleep:[], meta:null};
function setSaveState(t){ $('#saveState').textContent=t; }
const userCol = c => collection(fdb,'users',user.uid,c);
function stopData(){ unsubs.forEach(u=>{ try{u();}catch(e){} }); unsubs=[]; if(rdUnsub){ try{rdUnsub();}catch(e){} rdUnsub=null; RD.date=null; RD.doc=null; } }
function startData(){
  stopData();
  ['plans','library','workouts'].forEach(col=>{
    unsubs.push(onSnapshot(userCol(col),{includeMetadataChanges:true},snap=>{
      const o={}; snap.forEach(d=>{ o[d.id]={...d.data(),id:d.id}; }); S[col]=o;
      setSaveState(snap.metadata.hasPendingWrites?'Saving…':(snap.metadata.fromCache?'Offline · changes sync later':'All changes saved'));
      renderAll();
    },err=>{ setSaveState('Can’t reach your data'); toast('Couldn’t load your '+col+': '+err.message); }));
  });
  unsubs.push(onSnapshot(query(userCol('sleep'),orderBy('date','desc'),limit(100)),snap=>{
    SL.sleep=snap.docs.map(d=>d.data()); if(currentView()==='week') renderWeek();
  },()=>{}));
  unsubs.push(onSnapshot(doc(fdb,'users',user.uid,'meta','garmin'),snap=>{
    SL.meta=snap.exists()?snap.data():null; if(currentView()==='today') renderToday();
  },()=>{}));
  subReadiness();
}
async function put(col,id,data){
  const body={...data}; delete body.id;
  Object.keys(body).forEach(k=>{ if(body[k]===undefined) delete body[k]; });
  S[col][id]={...body,id};
  renderAll();
  try{ await setDoc(doc(fdb,'users',user.uid,col,id),body); }
  catch(e){ setSaveState('Not saved'); toast('That change didn’t save: '+e.message); }
}
async function del(col,id){
  delete S[col][id];
  renderAll();
  try{ await deleteDoc(doc(fdb,'users',user.uid,col,id)); }
  catch(e){ toast('That delete didn’t save: '+e.message); }
}

let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3200); }

/* ---------- routing ---------- */
const VIEWS=['today','week','calendar','dashboard','library'];
// #home is the old name for Today; installed home-screen apps still open on it.
function currentView(){ const h=location.hash.slice(1); return VIEWS.includes(h)?h:'today'; }
function showView(){
  const v=currentView();
  document.querySelectorAll('.nav a,.tabbar a').forEach(a=>a.setAttribute('aria-current',a.dataset.view===v?'page':'false'));
  VIEWS.forEach(k=>$('#view-'+k).hidden = k!==v);
  renderAll();
}
window.addEventListener('hashchange',()=>{ if(user) showView(); });

function renderAll(){
  renderToolbar();
  const v=currentView();
  if(!user) return;
  if(v==='today') renderToday();
  else if(v==='week') renderWeek();
  else if(v==='calendar') renderCalendar();
  else if(v==='dashboard') renderDash();
  else renderLibrary();
}

/* ---------- toolbar ---------- */
function renderToolbar(){
  const box=$('#planChips');
  box.innerHTML='<span class="tb-label">Showing</span>'+plans().map(p=>
    `<button class="chip" data-plan="${esc(p.id)}" aria-pressed="${!UI.hidden.includes(p.id)}"><span class="dot" style="background:${esc(p.color)}"></span>${esc(p.name)}</button>`).join('');
  const sel=$('#activePlan');
  if(!plans().some(p=>p.id===UI.activePlan)) UI.activePlan='base';
  sel.innerHTML=plans().map(p=>`<option value="${esc(p.id)}"${p.id===UI.activePlan?' selected':''}>${esc(p.name)}</option>`).join('');
}
$('#planChips').addEventListener('click',e=>{
  const b=e.target.closest('[data-plan]'); if(!b) return;
  const id=b.dataset.plan;
  UI.hidden = UI.hidden.includes(id) ? UI.hidden.filter(x=>x!==id) : [...UI.hidden,id];
  lsSet('hidden',UI.hidden); renderAll();
});
$('#activePlan').addEventListener('change',e=>{ UI.activePlan=e.target.value; lsSet('activePlan',UI.activePlan); });
$('#btnPlans').addEventListener('click',openPlans);
$('#btnToday').addEventListener('click',()=>scrollToWeek(monday(new Date()),true));

/* ---------- calendar ---------- */
let rangeStart = addDays(monday(new Date()),-7*4);
let weekCount = 24;
const scroller = $('#calScroll');

function byDate(){
  const m={};
  Object.values(S.workouts).forEach(w=>{ if(!visible(w)) return; (m[w.date]=m[w.date]||[]).push(w); });
  Object.values(m).forEach(a=>a.sort((x,y)=>(x.order||0)-(y.order||0)));
  return m;
}
function cardHTML(w){
  const d=DISC[w.disc]||DISC.other, p=planById(w.plan||'base');
  const showPlanDot = plans().filter(x=>!UI.hidden.includes(x.id)).length>1;
  const val = (+w.dist>0) ? fmtKm(w.dist,w.disc) : (+w.dur>0 ? fmtDur(w.dur) : '');
  return `<div class="card${w.race?' race':''}" draggable="true" data-id="${esc(w.id)}" tabindex="0" role="button" aria-label="${esc(d.name+': '+w.title)}">
    <div class="card-top" style="color:${d.color}">${IC[w.disc]||IC.other}<span>${d.name}</span><span class="gap"></span>
      ${w.race?`<span class="flag" title="Race">${IC.flag}</span>`:''}
      ${w.notes?`<span class="notes-ic" data-notes="${esc(w.id)}" title="View notes">${IC.notes}</span>`:''}
      ${showPlanDot?`<span class="plan-dot" style="background:${esc(p.color)}" title="${esc(p.name)}"></span>`:''}
    </div>
    <div class="card-title">${esc(w.title)}</div>
    ${val?`<div class="card-dist num">${val}</div>`:''}
  </div>`;
}
function weekSummary(ws, map){
  const tot={}; let t=0,dist=0,races=[];
  for(let i=0;i<7;i++){ (map[iso(addDays(ws,i))]||[]).forEach(w=>{
    const k=DISC[w.disc]?w.disc:'other'; tot[k]=tot[k]||{t:0,d:0}; tot[k].t+=+w.dur||0; tot[k].d+=+w.dist||0; t+=+w.dur||0; dist+=+w.dist||0; if(w.race) races.push(w);
  }); }
  const rows=DKEYS.filter(k=>tot[k]).map(k=>`<div class="ws-row"><span style="color:${DISC[k].color}" title="${DISC[k].name}">${IC[k]}</span><span class="t">${fmtDur(tot[k].t)}</span><span class="d">${tot[k].d>0?fmtKm(tot[k].d,k):'–'}</span></div>`).join('');
  return `<div class="wsum">
    <div class="ws-head"><span>Wk ${isoWeek(ws)}</span><span>${ws.getDate()} ${MON[ws.getMonth()]}</span></div>
    ${t||dist?`<div class="ws-total num"><b>${fmtDur(t)}</b><span>${dist.toFixed(1)} km</span></div><div class="ws-rows">${rows}</div>`:'<div class="ws-empty">Nothing planned</div>'}
    ${races.map(r=>`<div class="ws-race">${IC.flag}${esc(r.title)}</div>`).join('')}
  </div>`;
}
function renderCalendar(){
  const map=byDate(), td=today(), thisMon=iso(monday(new Date()));
  let h='';
  for(let i=0;i<weekCount;i++){
    const ws=addDays(rangeStart,i*7);
    h+=`<div class="cal-grid week${iso(ws)===thisMon?' this-week':''}" data-week="${iso(ws)}">`;
    for(let j=0;j<7;j++){
      const d=addDays(ws,j), ds=iso(d);
      const showM = d.getDate()===1 || (i===0 && j===0);
      h+=`<div class="day${ds===td?' today':''}${ds<td?' past':''}" data-date="${ds}">
        <div class="day-num"><span class="n num">${d.getDate()}</span>${showM?`<span class="m">${MON[d.getMonth()]} ${d.getMonth()===0||i===0&&j===0?d.getFullYear():''}</span>`:''}</div>
        ${(map[ds]||[]).map(cardHTML).join('')}
        <button class="day-add" data-add="${ds}" aria-label="Add workout on ${fmtDate(ds)}">${IC.plus}</button>
      </div>`;
    }
    h+=weekSummary(ws,map)+'</div>';
  }
  $('#weeks').innerHTML=h;
}
function scrollToWeek(ws,smooth){
  const s=iso(ws);
  if(ws<rangeStart){ const extra=Math.ceil((rangeStart-ws)/(7*864e5))+2; rangeStart=addDays(rangeStart,-7*extra); weekCount+=extra; renderCalendar(); }
  const el=document.querySelector(`.week[data-week="${s}"]`); if(!el) return;
  const head=document.querySelector('.cal-head').offsetHeight;
  scroller.scrollTo({top:el.getBoundingClientRect().top-scroller.getBoundingClientRect().top+scroller.scrollTop-head,behavior:smooth?'smooth':'auto'});
}
let extending=false;
scroller.addEventListener('scroll',()=>{
  if(extending||currentView()!=='calendar') return;
  if(scroller.scrollTop<240){
    extending=true;
    const before=scroller.scrollHeight;
    rangeStart=addDays(rangeStart,-7*6); weekCount+=6; renderCalendar();
    scroller.scrollTop+=scroller.scrollHeight-before;
    extending=false;
  } else if(scroller.scrollHeight-scroller.scrollTop-scroller.clientHeight<500){
    extending=true; weekCount+=8; renderCalendar(); extending=false;
  }
},{passive:true});

$('#weeks').addEventListener('click',e=>{
  const n=e.target.closest('[data-notes]'); if(n){ e.stopPropagation(); openNotes(n.dataset.notes); return; }
  const a=e.target.closest('[data-add]'); if(a){ openAdd(a.dataset.add); return; }
  const c=e.target.closest('.card'); if(c){ openEditor({workout:S.workouts[c.dataset.id]}); }
});
$('#weeks').addEventListener('keydown',e=>{
  const c=e.target.closest('.card'); if(c&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); openEditor({workout:S.workouts[c.dataset.id]}); }
});
$('#weeks').addEventListener('dblclick',e=>{
  if(e.target.closest('.card')) return;
  const d=e.target.closest('.day'); if(d) openAdd(d.dataset.date);
});
/* drag & drop: move, hold Alt / Option to copy */
let dragId=null;
$('#weeks').addEventListener('dragstart',e=>{ const c=e.target.closest('.card'); if(!c) return; dragId=c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed='copyMove'; try{e.dataTransfer.setData('text/plain',dragId);}catch(_){} });
$('#weeks').addEventListener('dragend',e=>{ const c=e.target.closest('.card'); if(c) c.classList.remove('dragging'); document.querySelectorAll('.day.drop').forEach(x=>x.classList.remove('drop')); });
$('#weeks').addEventListener('dragover',e=>{ const d=e.target.closest('.day'); if(!d||!dragId) return; e.preventDefault(); document.querySelectorAll('.day.drop').forEach(x=>x!==d&&x.classList.remove('drop')); d.classList.add('drop'); });
$('#weeks').addEventListener('drop',e=>{
  const d=e.target.closest('.day'); if(!d||!dragId) return; e.preventDefault();
  const w=S.workouts[dragId]; dragId=null; if(!w) return;
  if(e.altKey){ const id=uid('w'); put('workouts',id,{...w,id,date:d.dataset.date,order:Date.now()}); toast('Copied to '+fmtDate(d.dataset.date)); }
  else if(w.date!==d.dataset.date){ put('workouts',w.id,{...w,date:d.dataset.date,order:Date.now()}); }
});

/* ---------- modal plumbing ---------- */
let modalClose=null;
function openModal(html,onMount){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const scrim=$('#scrim');
  scrim.addEventListener('mousedown',e=>{ if(e.target===scrim) closeModal(); });
  scrim.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeModal));
  modalClose=e=>{ if(e.key==='Escape') closeModal(); };
  document.addEventListener('keydown',modalClose);
  onMount&&onMount(scrim);
  const f=scrim.querySelector('[autofocus]')||scrim.querySelector('input,button'); f&&f.focus();
}
function closeModal(){ $('#modalRoot').innerHTML=''; document.removeEventListener('keydown',modalClose); }
const head = (t,sub) => `<div class="m-head"><h2>${t}${sub?` <span class="sub">${sub}</span>`:''}</h2><button class="x" data-close aria-label="Close">${IC.x}</button></div>`;
function armDelete(btn,fn){
  btn.addEventListener('click',()=>{
    if(btn.classList.contains('armed')){ fn(); return; }
    btn.classList.add('armed'); btn.dataset.orig=btn.textContent; btn.textContent=btn.dataset.confirm||'Click again to delete';
    setTimeout(()=>{ if(btn.isConnected){ btn.classList.remove('armed'); btn.textContent=btn.dataset.orig; } },3500);
  });
}

/* ---------- notes viewer ---------- */
function openNotes(id){
  const w=S.workouts[id]; if(!w) return;
  const d=DISC[w.disc]||DISC.other;
  openModal(head(esc(w.title), esc(fmtDate(w.date)))+
    `<div class="m-body"><div style="display:flex;gap:16px;flex-wrap:wrap;font-weight:600;color:var(--muted)">
      <span style="color:${d.color};display:flex;gap:6px;align-items:center"><span style="width:15px;height:15px;display:inline-grid">${IC[w.disc]||IC.other}</span>${d.name}</span>
      ${+w.dur?`<span class="num">${fmtDur(w.dur)}</span>`:''}${+w.dist?`<span class="num">${fmtKm(w.dist,w.disc)}</span>`:''}
      <span>${esc(planById(w.plan).name)}</span></div>
      <div style="white-space:pre-wrap;line-height:1.55;max-width:62ch">${esc(w.notes)}</div></div>
     <div class="m-foot"><span class="gap"></span><button class="btn" data-close>Close</button><button class="btn primary" id="nEdit">Edit workout</button></div>`,
    s=>s.querySelector('#nEdit').addEventListener('click',()=>openEditor({workout:w})));
}

/* ---------- add from library ---------- */
function openAdd(date){
  let filt='all', q='';
  const list=()=>{
    const items=Object.values(S.library).filter(t=>(filt==='all'||t.disc===filt)&&(!q||(t.title+' '+(t.notes||'')).toLowerCase().includes(q)))
      .sort((a,b)=>DKEYS.indexOf(a.disc)-DKEYS.indexOf(b.disc)||a.title.localeCompare(b.title));
    if(!Object.keys(S.library).length) return '<div class="empty">Your library is empty. Start a blank workout, then tick “Also save to library”.</div>';
    if(!items.length) return '<div class="empty">No library workouts match.</div>';
    return '<div class="lib-list">'+items.map(t=>{const d=DISC[t.disc]||DISC.other; const meta=[+t.dur?fmtDur(t.dur):'',+t.dist?fmtKm(t.dist,t.disc):''].filter(Boolean).join(' · ');
      return `<button class="lib-item" data-tpl="${esc(t.id)}"><span style="color:${d.color}">${t.race?IC.flag:(IC[t.disc]||IC.other)}</span><span style="min-width:0"><div class="t">${esc(t.title)}</div>${t.notes?`<div class="s">${esc(t.notes.split('\n')[0])}</div>`:''}</span><span class="meta num">${meta}</span></button>`;}).join('')+'</div>';
  };
  openModal(head('Add workout', esc(fmtDate(date)))+
    `<div class="m-body">
      <div class="lib-pick-top"><button class="btn primary" id="aBlank">${IC.plus}Blank workout</button><button class="btn pink" id="aRace">${IC.flag}Training race</button></div>
      <div class="lib-pick-top"><input class="inp" id="aSearch" placeholder="Search library" style="flex:1;min-width:160px" autofocus>
        <select class="sel" id="aDisc" aria-label="Discipline"><option value="all">All disciplines</option>${DKEYS.map(k=>`<option value="${k}">${DISC[k].name}</option>`).join('')}</select></div>
      <div id="aList">${list()}</div>
    </div>`,
    s=>{
      s.querySelector('#aBlank').addEventListener('click',()=>openEditor({date}));
      s.querySelector('#aRace').addEventListener('click',()=>openEditor({date,race:true}));
      s.querySelector('#aSearch').addEventListener('input',e=>{ q=e.target.value.toLowerCase().trim(); s.querySelector('#aList').innerHTML=list(); });
      s.querySelector('#aDisc').addEventListener('change',e=>{ filt=e.target.value; s.querySelector('#aList').innerHTML=list(); });
      s.querySelector('#aList').addEventListener('click',e=>{ const b=e.target.closest('[data-tpl]'); if(b) openEditor({date,template:S.library[b.dataset.tpl]}); });
    });
}

/* ---------- workout / template editor ---------- */
function openEditor(opt){
  const isTpl = !!opt.libraryMode;
  const src = opt.workout || opt.template || opt.libItem || {};
  const existing = opt.workout ? opt.workout : (opt.libItem || null);
  const st = {
    disc: src.disc || 'run',
    title: src.title || '',
    date: opt.workout ? src.date : (opt.date || today()),
    plan: opt.workout ? (src.plan||'base') : UI.activePlan,
    dur: src.dur ? fmtDur(src.dur) : '',
    dist: +src.dist ? String(src.disc==='swim'? Math.round(src.dist*1000) : +(+src.dist).toFixed(2)) : '',
    notes: src.notes || '',
    race: opt.race || !!src.race,
    prio: src.prio || 'B'
  };
  const title = isTpl ? (existing?'Edit library workout':'New library workout') : (existing?'Edit workout':(st.race?'New training race':'New workout'));
  const distLabel = () => st.disc==='swim' ? 'Distance (m)' : 'Distance (km)';
  openModal(head(title)+
    `<div class="m-body">
      <div class="field full"><label>Discipline</label><div class="disc-pick" id="eDisc">${DKEYS.map(k=>`<button type="button" data-d="${k}" style="color:${DISC[k].color}" aria-pressed="${k===st.disc}">${IC[k]}<span style="color:var(--ink)">${DISC[k].name}</span></button>`).join('')}</div></div>
      <div class="fields">
        <div class="field full"><label for="eTitle">Title</label><input id="eTitle" value="${esc(st.title)}" placeholder="${st.race?'e.g. Bay to Bay 10K':'e.g. Tempo run'}" autofocus></div>
        ${isTpl?'':`<div class="field"><label for="eDate">Date</label><input id="eDate" type="date" value="${esc(st.date)}"></div>
        <div class="field"><label for="ePlan">Plan</label><select id="ePlan">${plans().map(p=>`<option value="${esc(p.id)}"${p.id===st.plan?' selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`}
        <div class="field"><label for="eDur">Duration</label><input id="eDur" value="${esc(st.dur)}" placeholder="h:mm" inputmode="numeric"><span class="hint">h:mm, or minutes</span></div>
        <div class="field"><label for="eDist" id="eDistL">${distLabel()}</label><input id="eDist" value="${esc(st.dist)}" inputmode="decimal" placeholder="0"></div>
        <div class="field full"><label for="eNotes">Notes</label><textarea id="eNotes" placeholder="Structure, targets, fuelling, route…">${esc(st.notes)}</textarea></div>
      </div>
      <div class="race-box${st.race?' on':''}" id="eRaceBox">
        <label class="toggle"><input type="checkbox" id="eRace"${st.race?' checked':''}>Training race</label>
        <span id="ePrioWrap"${st.race?'':' hidden'} style="display:flex;gap:8px;align-items:center"><span class="tb-label">Priority</span>
          <span class="seg" id="ePrio">${['A','B','C'].map(p=>`<button type="button" data-p="${p}" aria-pressed="${p===st.prio}">${p}</button>`).join('')}</span></span>
      </div>
      ${(!isTpl && !existing)?`<label class="toggle" style="font-weight:500"><input type="checkbox" id="eSaveLib">Also save to library</label>`:''}
      <div class="err" id="eErr" hidden></div>
    </div>
    <div class="m-foot">
      ${existing?`<button class="btn danger" id="eDel" data-confirm="Click again to delete">Delete</button>`:''}
      ${(!isTpl && existing)?`<button class="btn" id="eDup">Duplicate</button><button class="btn" id="eToLib">Save to library</button>`:''}
      <span class="gap"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="eSave">Save</button>
    </div>`,
  s=>{
    const q=x=>s.querySelector(x);
    q('#eDisc').addEventListener('click',e=>{ const b=e.target.closest('[data-d]'); if(!b) return;
      const prev=st.disc; st.disc=b.dataset.d;
      q('#eDisc').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.d===st.disc));
      const v=parseFloat(q('#eDist').value);
      if(!isNaN(v)){ if(prev!=='swim'&&st.disc==='swim') q('#eDist').value=Math.round(v*1000); else if(prev==='swim'&&st.disc!=='swim') q('#eDist').value=+(v/1000).toFixed(2); }
      q('#eDistL').textContent=distLabel(); });
    q('#eRace').addEventListener('change',e=>{ st.race=e.target.checked; q('#eRaceBox').classList.toggle('on',st.race); q('#ePrioWrap').hidden=!st.race; });
    q('#ePrio').addEventListener('click',e=>{ const b=e.target.closest('[data-p]'); if(!b) return; st.prio=b.dataset.p; q('#ePrio').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.p===st.prio)); });
    const collect=()=>{
      const err=q('#eErr'); err.hidden=true;
      const title=q('#eTitle').value.trim();
      if(!title){ err.textContent='Give the workout a title.'; err.hidden=false; q('#eTitle').focus(); return null; }
      const dur=parseDur(q('#eDur').value);
      if(isNaN(dur)){ err.textContent='Duration should look like 1:30 or 90.'; err.hidden=false; return null; }
      let dist=parseFloat(String(q('#eDist').value).replace(',','.'));
      if(q('#eDist').value.trim() && isNaN(dist)){ err.textContent='Distance should be a number.'; err.hidden=false; return null; }
      dist=isNaN(dist)?0:(st.disc==='swim'?dist/1000:dist);
      const o={disc:st.disc,title,dur,dist:+dist.toFixed(3),notes:q('#eNotes').value,race:st.race,prio:st.race?st.prio:''};
      if(!isTpl){ const date=q('#eDate').value; if(!date){ err.textContent='Pick a date.'; err.hidden=false; return null; } o.date=date; o.plan=q('#ePlan').value; }
      return o;
    };
    q('#eSave').addEventListener('click',()=>{
      const o=collect(); if(!o) return;
      if(isTpl){ const id=existing?existing.id:uid('t'); put('library',id,{...o,created:existing?existing.created||Date.now():Date.now()}); closeModal(); toast(existing?'Library workout updated':'Added to library'); return; }
      const id=existing?existing.id:uid('w');
      put('workouts',id,{...o,order:existing?existing.order||Date.now():Date.now(),created:existing?existing.created||Date.now():Date.now()});
      const sl=q('#eSaveLib'); if(sl&&sl.checked){ const {date,plan,...t}=o; put('library',uid('t'),{...t,created:Date.now()}); }
      closeModal();
      if(UI.hidden.includes(o.plan)) toast('Saved to '+planById(o.plan).name+', which is hidden right now');
    });
    const delB=q('#eDel'); if(delB) armDelete(delB,()=>{ del(isTpl?'library':'workouts',existing.id); closeModal(); toast('Deleted'); });
    const dup=q('#eDup'); if(dup) dup.addEventListener('click',()=>{ const o=collect(); if(!o) return; put('workouts',uid('w'),{...o,order:Date.now(),created:Date.now()}); closeModal(); toast('Duplicated on '+fmtDate(o.date)); });
    const tl=q('#eToLib'); if(tl) tl.addEventListener('click',()=>{ const o=collect(); if(!o) return; const {date,plan,...t}=o; put('library',uid('t'),{...t,created:Date.now()}); toast('Saved “'+o.title+'” to library'); });
  });
}

/* ---------- plans manager ---------- */
function openPlans(){
  const counts={}; Object.values(S.workouts).forEach(w=>{ const p=w.plan||'base'; counts[p]=(counts[p]||0)+1; });
  const row=p=>`<div class="plan-row" data-pid="${esc(p.id)}">
      <input value="${esc(p.name)}" aria-label="Plan name" data-name>
      <div class="swatches">${PLAN_COLORS.map(c=>`<button type="button" data-c="${c}" style="background:${c}" aria-label="Colour ${c}" aria-pressed="${c.toLowerCase()===String(p.color).toLowerCase()}"></button>`).join('')}</div>
      ${p.id==='base'?'<span></span>':`<button class="btn danger" data-delp data-confirm="Delete plan + ${counts[p.id]||0} workouts?">Delete</button>`}
      <div class="cnt">${counts[p.id]||0} workout${(counts[p.id]||0)===1?'':'s'} planned${p.id==='base'?' · Base is the default plan for unassigned work':''}</div>
    </div>`;
  openModal(head('Plans')+
    `<div class="m-body"><div class="plans-list" id="pList">${plans().map(row).join('')}</div>
      <div style="display:flex;gap:8px"><input class="inp" id="pNew" placeholder="New plan name, e.g. Two Oceans build" style="flex:1;min-width:0"><button class="btn primary" id="pAdd">${IC.plus}Add plan</button></div></div>
     <div class="m-foot"><span class="gap"></span><button class="btn primary" data-close>Done</button></div>`,
  s=>{
    const list=s.querySelector('#pList');
    list.addEventListener('change',e=>{ if(!e.target.matches('[data-name]')) return; const id=e.target.closest('[data-pid]').dataset.pid; const p=planById(id); const name=e.target.value.trim()||p.name; put('plans',id,{name,color:p.color,created:p.created||Date.now()}); });
    list.addEventListener('click',e=>{ const c=e.target.closest('[data-c]'); if(!c) return; const r=c.closest('[data-pid]'); const p=planById(r.dataset.pid);
      put('plans',p.id,{name:p.name,color:c.dataset.c,created:p.created||Date.now()}); r.querySelectorAll('[data-c]').forEach(b=>b.setAttribute('aria-pressed',b===c)); });
    list.querySelectorAll('[data-delp]').forEach(b=>armDelete(b,()=>{ const id=b.closest('[data-pid]').dataset.pid;
      Object.values(S.workouts).filter(w=>w.plan===id).forEach(w=>del('workouts',w.id)); del('plans',id); b.closest('.plan-row').remove(); toast('Plan deleted'); }));
    const add=()=>{ const n=s.querySelector('#pNew').value.trim(); if(!n) return; const used=plans().map(p=>p.color); const color=PLAN_COLORS.find(c=>!used.includes(c))||PLAN_COLORS[0];
      const id=uid('p'); put('plans',id,{name:n,color,created:Date.now()}); list.insertAdjacentHTML('beforeend',row({id,name:n,color}));
      list.lastElementChild.querySelectorAll('[data-delp]').forEach(b=>armDelete(b,()=>{ Object.values(S.workouts).filter(w=>w.plan===id).forEach(w=>del('workouts',w.id)); del('plans',id); b.closest('.plan-row').remove(); }));
      s.querySelector('#pNew').value=''; };
    s.querySelector('#pAdd').addEventListener('click',add);
    s.querySelector('#pNew').addEventListener('keydown',e=>{ if(e.key==='Enter') add(); });
  });
}

/* ---------- dashboard ---------- */
function dashRange(){
  const tm=monday(new Date());
  const sel=UI.dashPlans.length?UI.dashPlans:plans().map(p=>p.id);
  const inPlans=Object.values(S.workouts).filter(w=>sel.includes(w.plan||'base')&&plans().some(p=>p.id===(w.plan||'base')));
  let from,to;
  switch(UI.dashRange){
    case 'thisweek': from=tm; to=addDays(tm,6); break;
    case 'last4': from=addDays(tm,-28); to=addDays(tm,-1); break;
    case 'next4': from=tm; to=addDays(tm,27); break;
    case 'next12': from=tm; to=addDays(tm,83); break;
    case 'custom': from=UI.dashFrom?monday(parse(UI.dashFrom)):tm; to=UI.dashTo?parse(UI.dashTo):addDays(tm,83); break;
    default: { const ds=inPlans.map(w=>w.date).sort(); from=ds.length?monday(parse(ds[0])):tm; to=ds.length?parse(ds[ds.length-1]):addDays(tm,6); }
  }
  if(to<from) to=addDays(from,6);
  const f=iso(from), t=iso(to);
  return {from,to,list:inPlans.filter(w=>w.date>=f&&w.date<=t)};
}
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function chartSVG(from,to,list,metric){
  const weeks=[]; for(let d=monday(from); d<=to; d=addDays(d,7)) weeks.push(d);
  if(!weeks.length) return '';
  const val=w=>metric==='time'?(+w.dur||0)/60:(+w.dist||0);
  const data=weeks.map(ws=>{ const a=iso(ws), b=iso(addDays(ws,6)); const o={}; list.forEach(w=>{ if(w.date>=a&&w.date<=b){ const k=DISC[w.disc]?w.disc:'other'; o[k]=(o[k]||0)+val(w);} }); return o; });
  const tot=data.map(o=>DKEYS.reduce((s,k)=>s+(o[k]||0),0));
  const max=niceMax(Math.max(...tot,0)*1.05);
  const W=Math.max(640,weeks.length*44+60), H=260, L=44, R=12, T=14, B=34, cw=(W-L-R)/weeks.length, bw=Math.min(28,cw*.62);
  const y=v=>T+(H-T-B)*(1-v/max);
  let g='';
  for(let i=0;i<=4;i++){ const v=max*i/4, yy=y(v); g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" style="stroke:var(--line);stroke-width:1"/><text x="${L-8}" y="${yy+4}" text-anchor="end">${metric==='time'?(+v.toFixed(1))+'h':Math.round(v)}</text>`; }
  const step=Math.ceil(weeks.length/14);
  const thisMon=iso(monday(new Date()));
  weeks.forEach((ws,i)=>{
    const x=L+cw*i+(cw-bw)/2; let acc=0;
    DKEYS.forEach(k=>{ const v=data[i][k]||0; if(!v) return; const y1=y(acc+v), y0=y(acc); g+=`<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(0,y0-y1-1)}" rx="1.5" style="fill:${DISC[k].color}"><title>${DISC[k].name}: ${metric==='time'?fmtDur(v*60):v.toFixed(1)+' km'}</title></rect>`; acc+=v; });
    if(i%step===0) g+=`<text x="${x+bw/2}" y="${H-B+16}" text-anchor="middle" style="${iso(ws)===thisMon?'fill:var(--violet);font-weight:700':''}">${ws.getDate()} ${MON[ws.getMonth()]}</text>`;
    if(tot[i]>0 && weeks.length<=20) g+=`<text x="${x+bw/2}" y="${y(tot[i])-5}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${metric==='time'?fmtDur(tot[i]*60):Math.round(tot[i])}</text>`;
  });
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--line-2);stroke-width:1"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly ${metric==='time'?'hours':'distance'} by discipline">${g}</svg>`;
}
function renderDash(){
  const {from,to,list}=dashRange();
  const T=list.reduce((s,w)=>s+(+w.dur||0),0), D=list.reduce((s,w)=>s+(+w.dist||0),0);
  const nWeeks=Math.max(1,Math.round((to-monday(from))/(7*864e5)+1/7));
  const races=list.filter(w=>w.race).sort((a,b)=>a.date.localeCompare(b.date));
  const per=DKEYS.map(k=>{ const ws=list.filter(w=>(DISC[w.disc]?w.disc:'other')===k); const t=ws.reduce((s,w)=>s+(+w.dur||0),0), d=ws.reduce((s,w)=>s+(+w.dist||0),0);
    const longest=ws.reduce((m,w)=>(+w.dist||0)>(m?+m.dist||0:-1)?w:m,null); const longT=ws.reduce((m,w)=>(+w.dur||0)>(m?+m.dur||0:-1)?w:m,null);
    return {k,n:ws.length,t,d,longest,longT}; }).filter(r=>r.n);
  const sel=UI.dashPlans;
  const ranges=[['thisweek','This week'],['next4','Next 4 weeks'],['next12','Next 12 weeks'],['last4','Last 4 weeks'],['plan','Whole plan'],['custom','Custom']];
  const sub=`${from.getDate()} ${MON[from.getMonth()]} ${from.getFullYear()} – ${to.getDate()} ${MON[to.getMonth()]} ${to.getFullYear()} · ${nWeeks} week${nWeeks===1?'':'s'}`;
  $('#dash').innerHTML=`<div class="page-head"><div><h1>Dashboard</h1><p>${sub}</p></div></div>
    <div class="panel filters">
      <div class="tb-group"><span class="tb-label">Plans</span><button class="chip" data-dp="all" aria-pressed="${!sel.length}">All plans</button>${plans().map(p=>`<button class="chip" data-dp="${esc(p.id)}" aria-pressed="${sel.includes(p.id)}"><span class="dot" style="background:${esc(p.color)}"></span>${esc(p.name)}</button>`).join('')}</div>
      <div class="tb-group"><span class="tb-label">Period</span><select class="sel" id="dRange" aria-label="Period">${ranges.map(([v,l])=>`<option value="${v}"${UI.dashRange===v?' selected':''}>${l}</option>`).join('')}</select>
        ${UI.dashRange==='custom'?`<input class="inp" type="date" id="dFrom" value="${esc(UI.dashFrom||iso(from))}" aria-label="From"><span style="color:var(--muted)">to</span><input class="inp" type="date" id="dTo" value="${esc(UI.dashTo||iso(to))}" aria-label="To">`:''}</div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="l">Planned time</div><div class="v num">${fmtDur(T)}<small>h</small></div><div class="s">${fmtDur(T/nWeeks)} h per week</div></div>
      <div class="kpi"><div class="l">Distance</div><div class="v num">${D>=100?Math.round(D):D.toFixed(1)}<small>km</small></div><div class="s">${(D/nWeeks).toFixed(1)} km per week</div></div>
      <div class="kpi"><div class="l">Sessions</div><div class="v num">${list.length}</div><div class="s">${(list.length/nWeeks).toFixed(1)} per week</div></div>
      <div class="kpi pinkv"><div class="l">Training races</div><div class="v num">${races.length}</div><div class="s">${races.filter(r=>r.prio==='A').length} A · ${races.filter(r=>r.prio==='B').length} B · ${races.filter(r=>r.prio==='C').length} C</div></div>
    </div>
    <div class="panel">
      <div class="chart-head"><h2>Weekly volume</h2>
        <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div class="legend">${DKEYS.map(k=>`<span><i style="background:${DISC[k].color}"></i>${DISC[k].name}</span>`).join('')}</div>
        <span class="seg" id="dMetric"><button type="button" data-m="time" aria-pressed="${UI.dashMetric==='time'}">Hours</button><button type="button" data-m="dist" aria-pressed="${UI.dashMetric==='dist'}">Kilometres</button></span></div></div>
      <div class="chart-wrap">${list.length?chartSVG(from,to,list,UI.dashMetric):'<div class="empty">Nothing planned in this period for the selected plans.</div>'}</div>
    </div>
    <div class="dash-grid">
      <div class="panel" style="overflow-x:auto"><h2 style="margin-bottom:8px">By discipline</h2>
        ${per.length?`<table class="tbl"><thead><tr><th>Discipline</th><th>Sessions</th><th>Time</th><th>Distance</th><th>Per week</th><th>Share of time</th></tr></thead><tbody>
        ${per.map(r=>`<tr><td><span class="dn"><span style="color:${DISC[r.k].color}">${IC[r.k]}</span>${DISC[r.k].name}</span></td><td>${r.n}</td><td>${fmtDur(r.t)}</td><td>${r.d>0?fmtKm(r.d,r.k):'–'}</td><td>${r.d>0?fmtKm(r.d/nWeeks,r.k):fmtDur(r.t/nWeeks)}</td>
          <td><span class="share">${T?Math.round(r.t/T*100):0}%<span class="b"><i style="width:${T?r.t/T*100:0}%;background:${DISC[r.k].color}"></i></span></span></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No sessions in this period.</div>'}
        ${per.length?`<h2 style="margin:18px 0 8px">Longest sessions</h2><div class="list">${per.map(r=>{ const w=(r.longest&&+r.longest.dist)?r.longest:r.longT; if(!w) return ''; return `<div class="li"><span style="color:${DISC[r.k].color};width:16px;height:16px;display:inline-grid">${IC[r.k]}</span><div><div class="t">${esc(w.title)}</div><div class="s">${esc(fmtDate(w.date))}</div></div><div class="num" style="font-family:var(--f-display);font-weight:700;font-size:15px">${+w.dist?fmtKm(w.dist,w.disc):fmtDur(w.dur)}</div></div>`; }).join('')}</div>`:''}
      </div>
      <div class="panel"><h2 style="margin-bottom:8px">Races in period</h2>
        ${races.length?`<div class="list">${races.map(r=>{ const d=parse(r.date); const days=Math.round((d-parse(today()))/864e5);
          return `<div class="li"><div class="date"><b>${d.getDate()}</b><span>${MON[d.getMonth()]}</span></div><div><div class="t">${esc(r.title)}</div><div class="s">${DISC[r.disc]?DISC[r.disc].name:'Other'}${+r.dist?' · '+fmtKm(r.dist,r.disc):''} · ${esc(planById(r.plan).name)}${days>=0?` · ${days===0?'today':'in '+days+' day'+(days===1?'':'s')}`:''}</div></div><span class="prio ${esc(r.prio||'B')}">${esc(r.prio||'B')}</span></div>`; }).join('')}</div>`
          :'<div class="empty">No training races in this period. Add one from any day’s + button.</div>'}
      </div>
    </div>`;
}
$('#dash').addEventListener('click',e=>{
  const c=e.target.closest('[data-dp]');

/* ---------- weather (Open-Meteo, no key needed) ---------- */
const W = {data:null, loc:null, err:null, at:0, loading:false};
const DEFAULT_LOC = {name:'Stellenbosch', lat:-33.9321, lon:18.8602};
const getLoc = () => lsGet('loc', DEFAULT_LOC); // saved home location: used when the device location isn't available
const WX_TTL = 60*60e3; // keep a forecast for about an hour
const WCODE = c => c===0?'Clear':c===1?'Mainly clear':c===2?'Partly cloudy':c===3?'Overcast':(c===45||c===48)?'Fog':c<=57?'Drizzle':c<=67?'Rain':c<=77?'Snow':c<=82?'Showers':c<=86?'Snow showers':c===95?'Thunderstorm':'Thunderstorm, hail';
const COMPASS = ['N','NE','E','SE','S','SW','W','NW'];
const compassLabel = deg => COMPASS[Math.round((((deg%360)+360)%360)/45)%8];
const CLOUD = '<path d="M9.5 25h13a5 5 0 0 0 .7-9.95A7 7 0 0 0 10.4 14.4 5.3 5.3 0 0 0 9.5 25z" stroke="var(--muted)" fill="var(--surface)"/>';
const SUN = (cx,cy,r) => `<circle cx="${cx}" cy="${cy}" r="${r}" stroke="var(--fair)"/><path d="${[0,45,90,135,180,225,270,315].map(a=>{ const t=a*Math.PI/180, r1=r+2.5, r2=r+5; return `M${(cx+r1*Math.cos(t)).toFixed(1)} ${(cy+r1*Math.sin(t)).toFixed(1)}L${(cx+r2*Math.cos(t)).toFixed(1)} ${(cy+r2*Math.sin(t)).toFixed(1)}`; }).join('')}" stroke="var(--fair)"/>`;
function wxIcon(c){
  let g;
  if(c<=1) g=SUN(16,16,6);
  else if(c===2) g=SUN(12,11,4.5)+`<g transform="translate(5 5) scale(.82)">${CLOUD}</g>`;
  else if(c===3||c===45||c===48) g=CLOUD;
  else if((c>=71&&c<=77)||c===85||c===86) g=`<g transform="translate(0 -3)">${CLOUD}</g><path d="M12 27h.01M16 29h.01M20 27h.01" stroke="var(--swim)" stroke-width="2.6"/>`;
  else if(c>=95) g=`<g transform="translate(0 -3)">${CLOUD}</g><path d="M17 23l-3 5h4l-2 4" stroke="var(--fair)"/>`;
  else g=`<g transform="translate(0 -3)">${CLOUD}</g><path d="M12 25l-1 3M16.5 25l-1 3M21 25l-1 3" stroke="var(--swim)"/>`;
  return `<svg class="wx-ic" viewBox="0 0 32 32" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${g}</svg>`;
}
const arrow = to => `<svg viewBox="0 0 16 16" aria-hidden="true"><path transform="rotate(${Math.round(to)} 8 8)" d="M8 1.5l4.2 6H9.3v7H6.7v-7H3.8z" fill="currentColor"/></svg>`;
function deviceLoc(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res(null);
    const t=setTimeout(()=>res(null),8000);
    navigator.geolocation.getCurrentPosition(
      p=>{ clearTimeout(t); res({name:'Current location',lat:+p.coords.latitude.toFixed(3),lon:+p.coords.longitude.toFixed(3)}); },
      ()=>{ clearTimeout(t); res(null); },
      {maximumAge:30*60e3,timeout:7000});
  });
}
async function loadWeather(force){
  if(W.loading) return;
  if(!W.data){ const c=lsGet('wx',null); if(c&&c.v===2&&c.data){ W.data=c.data; W.loc=c.loc; W.at=c.at; } }
  const fresh=W.data&&Date.now()-W.at<WX_TTL&&W.data.daily&&W.data.daily.time[0]===today();
  if(fresh&&!force) return;
  W.loading=true;
  const loc=(await deviceLoc())||getLoc();
  const url='https://api.open-meteo.com/v1/forecast?latitude='+loc.lat+'&longitude='+loc.lon+
    '&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m,wind_direction_10m'+
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant'+
    '&timezone=auto&forecast_days=1&wind_speed_unit=kmh';
  try{ const r=await fetch(url); if(!r.ok) throw new Error('HTTP '+r.status); W.data=await r.json(); W.loc=loc; W.at=Date.now(); W.err=null; lsSet('wx',{v:2,at:W.at,loc,data:W.data}); }
  catch(e){ W.err='Weather is unavailable right now.'; }
  W.loading=false;
  if(currentView()==='today') renderToday();
}
function weatherCard(){
  if(!W.data) return `<section class="hp"><div class="hp-head"><h2>Weather</h2></div><div class="empty">${W.err?esc(W.err):'Loading forecast…'}</div></section>`;

      <svg class="compass" viewBox="0 0 64 64" role="img" aria-label="${hasDir?'Wind from '+compassLabel(dir):'No wind direction'}"><circle cx="32" cy="32" r="30" fill="none" stroke="var(--line-2)" stroke-width="1.5"/><text x="32" y="13" text-anchor="middle">N</text>${hasDir?`<path transform="rotate(${Math.round(dir+180)} 32 32)" d="M32 19l7 10h-4.5v16h-5V29H25z" fill="var(--swim)"/>`:''}</svg>
      <div class="wx-wind"><b class="num">${Math.round(d.wind_speed_10m_max[0])} km/h</b><div class="sub num">${hasDir?'from '+compassLabel(dir)+' · ':''}gusts ${Math.round(d.wind_gusts_10m_max[0])}</div></div>
    </div>
