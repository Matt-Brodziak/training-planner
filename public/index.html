/* ---------- readiness (computed server-side once a day, see functions/readiness.js) ---------- */
const RD = {date:null, doc:null};
let rdUnsub=null;
function subReadiness(){
  const d=today(); if(RD.date===d&&rdUnsub) return;
  if(rdUnsub) rdUnsub();
  RD.date=d; RD.doc=null;
  rdUnsub=onSnapshot(doc(fdb,'users',user.uid,'readiness',d),snap=>{ RD.doc=snap.exists()?snap.data():null; if(currentView()==='today') renderToday(); },()=>{});
}
const BAND_COLOR={Prime:'var(--violet)',High:'var(--good)',Moderate:'var(--fair)',Low:'var(--run)',Poor:'var(--poor)'};
const RD_ORDER=['sleep','hrv','sleepHistory','rhr','load'];
const RD_LABEL={sleep:'Sleep',hrv:'HRV status',rhr:'Resting HR',sleepHistory:'Sleep history',load:'Acute load'};
const barColor = s => s>=70?'var(--good)':s>=40?'var(--fair)':'var(--poor)';
const hm = d => pad(d.getHours())+':'+pad(d.getMinutes());
function gaugeSVG(score,color){
  const arc='M15 76A60 60 0 0 1 135 76';
  return `<svg class="gauge" viewBox="0 0 150 86" role="img" aria-label="Readiness ${score} out of 100">
    <path d="${arc}" fill="none" stroke="var(--sunk)" stroke-width="14" stroke-linecap="round"/>
    ${score>0?`<path d="${arc}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="${score} 100"/>`:''}
    <text x="75" y="78" text-anchor="middle" class="gv">${score}</text></svg>`;
}
function syncFoot(){
  const meta=SL.meta, t=meta&&meta.lastSync&&meta.lastSync.toDate?meta.lastSync.toDate():null;
  const line=t?'Garmin synced '+(iso(t)===today()?'':fmtDate(iso(t))+' ')+hm(t):'Garmin not synced yet';
  return `<div class="h-foot"><span>${line}</span><button class="btn ghost sm" data-sync="8">Sync now</button></div>${meta&&meta.lastError?`<div class="err" style="margin-top:6px">${esc(meta.lastError)}</div>`:''}`;
}
function readinessCard(){
  const r=RD.doc, ok=r&&r.date===today()&&r.score!=null;
  const upd=ok&&r.computedAt&&r.computedAt.toDate?'Updated '+hm(r.computedAt.toDate()):'';
  const head=`<div class="hp-head"><h2>Readiness</h2><span class="hp-sub">${upd}</span></div>`;
  if(!ok) return `<section class="hp">${head}<div class="empty" style="padding:12px 4px">${r&&r.date===today()?'Not enough Garmin data for a score yet.':'Today’s score isn’t ready yet. It’s worked out after your morning Garmin sync.'}</div>${syncFoot()}</section>`;
  const color=BAND_COLOR[r.band]||'var(--violet)', comps=r.components||{}, missing=(r.missing||[]).length;
  const tiles=RD_ORDER.map((k,i)=>{ const c=comps[k]; const wide=i===RD_ORDER.length-1&&RD_ORDER.length%2===1;
    return `<div class="rd-c${wide?' wide':''}"><div class="row"><span>${RD_LABEL[k]}</span><b class="num">${c?esc(c.label):'—'}</b></div><div class="bar" role="img" aria-label="${RD_LABEL[k]} ${c?c.score+' out of 100':'no data'}"><i style="width:${c?c.score:0}%;background:${c?barColor(c.score):'transparent'}"></i></div></div>`; }).join('');
  const notes=[missing?`Based on ${RD_ORDER.length-missing} of ${RD_ORDER.length} factors.`:'', comps.load&&comps.load.source==='planned'?'Load estimated from planned workouts.':''].filter(Boolean).join(' ');
  return `<section class="hp">${head}
    <div class="rd-top">${gaugeSVG(r.score,color)}<div><div class="rd-band" style="color:${color}">${esc(r.band)}</div><div class="rd-tip">${esc(r.suggestion)}</div></div></div>
    <div class="rd-grid">${tiles}</div>
    ${notes?`<div class="rd-note">${notes}</div>`:''}
    ${syncFoot()}
  </section>`;
}

/* ---------- today ---------- */
const hms = s => { if(s==null) return '–'; const m=Math.round(s/60); return Math.floor(m/60)+':'+pad(m%60); };
const DOWL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function homeWorkout(w){
  const d=DISC[w.disc]||DISC.other, p=planById(w.plan||'base');
  const stats=[];
  if(+w.dur) stats.push(`<span><b class="num">${fmtDur(w.dur)}</b>duration</span>`);
  if(+w.dist) stats.push(`<span><b class="num">${fmtKm(w.dist,w.disc)}</b>distance</span>`);
  return `<button class="tw${w.race?' race':''}" data-open="${esc(w.id)}">
    <div class="tw-top"><span class="tw-ic" style="color:${d.color}">${IC[w.disc]||IC.other}</span><span class="tw-disc" style="color:${d.color}">${d.name}</span>
      <span class="gap"></span>${w.race?`<span class="prio ${esc(w.prio||'B')}">${esc(w.prio||'B')} race</span>`:''}<span class="tw-plan"><i style="background:${esc(p.color)}"></i>${esc(p.name)}</span></div>
    <div class="tw-title">${esc(w.title)}</div>
    ${stats.length?`<div class="tw-stats">${stats.join('')}</div>`:''}
    ${w.notes?`<div class="tw-notes">${esc(w.notes)}</div>`:''}
  </button>`;
}
/** "Week 3 · Base": the plan of today's workout (or this week's busiest plan), counted from that plan's first workout. */
function planWeekLabel(td,todays,map){
  const ws=monday(parse(td));
  let pid=todays[0]&&(todays[0].plan||'base');
  if(!pid){ const n={}; for(let i=0;i<7;i++) (map[iso(addDays(ws,i))]||[]).forEach(w=>{ const p=w.plan||'base'; n[p]=(n[p]||0)+1; }); pid=Object.keys(n).sort((a,b)=>n[b]-n[a])[0]; }
  if(!pid) return '';
  const first=Object.values(S.workouts).filter(w=>(w.plan||'base')===pid).map(w=>w.date).sort()[0];
  if(!first) return '';
  const wk=Math.round((ws-monday(parse(first)))/(7*864e5))+1;
  return (wk>=1?`Week ${wk} · `:'')+planById(pid).name;
}
function renderToday(){
  const td=today(), now=new Date(), map=byDate();
  const todays=map[td]||[];
  let next=null;
  if(!todays.length){ const later=Object.values(S.workouts).filter(w=>visible(w)&&w.date>td).sort((a,b)=>a.date.localeCompare(b.date)||(a.order||0)-(b.order||0)); next=later[0]||null; }
  const race=Object.values(S.workouts).filter(w=>visible(w)&&w.race&&w.date>=td).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const rdays=race?Math.round((parse(race.date)-parse(td))/864e5):0;
  $('#today').innerHTML=`
    <div class="dp-head"><div><div class="eyebrow">${DOWL[now.getDay()]} ${now.getDate()} ${MON[now.getMonth()]}</div><h1>Today</h1></div><div class="dp-meta">${esc(planWeekLabel(td,todays,map))}</div></div>
    ${race?`<div class="countdown"><span class="flag">${IC.flag}</span><div><b class="num">${rdays||'Today'}</b>${rdays?' days to':''} <span>${esc(race.title)}</span></div></div>`:''}
    ${readinessCard()}
    <section class="hp"><div class="hp-head"><h2>Workout</h2><button class="btn ghost sm" data-add-today>${IC.plus}Add</button></div>
      ${todays.length?`<div class="tw-list">${todays.map(homeWorkout).join('')}</div>`
        :`<div class="rest"><b>Rest day</b>${next?`<span>Next up: ${esc(fmtDate(next.date))} · ${esc((DISC[next.disc]||DISC.other).name)} · ${esc(next.title)}</span>`:'<span>Nothing else planned yet.</span>'}</div>`}
    </section>
    ${weatherCard()}`;
}
$('#today').addEventListener('click',e=>{
  const o=e.target.closest('[data-open]'); if(o){ const w=S.workouts[o.dataset.open]; if(w) openEditor({workout:w}); return; }
  if(e.target.closest('[data-add-today]')){ openAdd(today()); return; }
  const s=e.target.closest('[data-sync]'); if(s){ syncNow(+s.dataset.sync,s); return; }
  if(e.target.closest('[data-wx-refresh]')) loadWeather(true);
});
async function syncNow(days,btn){
  if(btn){ btn.disabled=true; btn.textContent='Syncing…'; }
  try{ const r=await httpsCallable(fns,'garminSyncNow')({days}); toast(`Synced ${r.data.saved} night${r.data.saved===1?'':'s'} from Garmin`); }
  catch(e){ toast(e.message||'Garmin sync failed'); }
  finally{ if(btn&&btn.isConnected){ btn.disabled=false; btn.textContent='Sync now'; } }
}

/* ---------- week ---------- */
const CHEV = d => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d<0?'M10 3L5 8l5 5':'M6 3l5 5-5 5'}"/></svg>`;
function weekChart(days,td){
  const W=340,H=150,T=6,B=24,cw=W/7,bw=Math.round(cw*.72);
  const tot=days.map(d=>d.list.reduce((s,w)=>s+(+w.dur||0),0));
  const max=Math.max(60,...tot);
  const y=v=>T+(H-T-B)*(1-v/max);
  let g='';
  days.forEach((d,i)=>{
    const x=+(cw*i+(cw-bw)/2).toFixed(1);
    if(!tot[i]) g+=`<rect x="${x}" y="${H-B-6}" width="${bw}" height="6" rx="3" style="fill:var(--line-2)"><title>${DOW[d.d.getDay()]}: rest</title></rect>`;
    else { let acc=0; const segs=DKEYS.map(k=>[k,d.list.filter(w=>(DISC[w.disc]?w.disc:'other')===k).reduce((s,w)=>s+(+w.dur||0),0)]).filter(s=>s[1]>0);
      segs.forEach(([k,v])=>{ const y1=y(acc+v), y0=y(acc); g+=`<rect x="${x}" y="${y1.toFixed(1)}" width="${bw}" height="${Math.max(2,y0-y1-1).toFixed(1)}" rx="3" style="fill:${DISC[k].color}"><title>${DOW[d.d.getDay()]} · ${DISC[k].name}: ${fmtDur(v)}</title></rect>`; acc+=v; }); }
    g+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle"${d.ds===td?' class="today"':''}>${DOW[d.d.getDay()]}</text>`;
  });
  return `<svg class="wk-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Planned time per day">${g}</svg>`;
}
function renderWeek(){
  const td=today(), thisMon=monday(new Date()), ws=UI.weekStart||thisMon, we=addDays(ws,6), map=byDate();
  const off=Math.round((ws-thisMon)/(7*864e5));
  const title=off===0?'This week':off===-1?'Last week':off===1?'Next week':'Week '+isoWeek(ws);
  const range=ws.getMonth()===we.getMonth()?`${ws.getDate()} – ${we.getDate()} ${MON[we.getMonth()]}`:`${ws.getDate()} ${MON[ws.getMonth()]} – ${we.getDate()} ${MON[we.getMonth()]}`;
  const days=[...Array(7)].map((_,i)=>{ const d=addDays(ws,i), ds=iso(d); return {d,ds,list:map[ds]||[]}; });
  const all=days.flatMap(d=>d.list);
  const T=all.reduce((s,w)=>s+(+w.dur||0),0);
  const km=DKEYS.map(k=>[k,all.filter(w=>(DISC[w.disc]?w.disc:'other')===k).reduce((s,w)=>s+(+w.dist||0),0)]).filter(x=>x[1]>0);
  const used=DKEYS.filter(k=>all.some(w=>(DISC[w.disc]?w.disc:'other')===k));

  const recs=SL.sleep.filter(s=>s.hasData);
  const nights=days.map(d=>({...d,rec:recs.find(s=>s.date===d.ds)}));
  const have=nights.filter(n=>n.rec), scored=have.filter(n=>n.rec.score!=null);
  const avg=have.length?have.reduce((s,n)=>s+n.rec.totalSec,0)/have.length:null;
  const avgScore=scored.length?Math.round(scored.reduce((s,n)=>s+n.rec.score,0)/scored.length):null;
  const maxS=Math.max(9*3600,...have.map(n=>n.rec.totalSec));

  const rest=off===0?days.filter(d=>d.ds>td):days;
  const restList=rest.flatMap(d=>d.list.map(w=>({w,d})));

  $('#week').innerHTML=`
    <div class="dp-head"><div><div class="eyebrow num">${range}</div><h1>${title}</h1></div>
      <div class="wk-nav">${off?`<button class="btn" data-wk="0">This week</button>`:''}<button class="icon-btn lg" data-wk="-1" aria-label="Previous week">${CHEV(-1)}</button><button class="icon-btn lg" data-wk="1" aria-label="Next week">${CHEV(1)}</button></div></div>
    <section class="hp"><div class="hp-head"><h2>Planned</h2><span class="hp-sub">${all.length} session${all.length===1?'':'s'}</span></div>
      ${all.length?`<div class="wk-stats num"><div><b>${fmtDur(T)}</b><span>Total time</span></div>${km.map(([k,v])=>`<div><b>${fmtKm(v,k)}</b><span>${DISC[k].name}</span></div>`).join('')}</div>
      ${weekChart(days,td)}
      <div class="legend">${used.map(k=>`<span><i style="background:${DISC[k].color}"></i>${DISC[k].name}</span>`).join('')}<span><i style="background:var(--line-2)"></i>Rest</span></div>`
      :'<div class="empty">Nothing planned this week.</div>'}
    </section>
    <section class="hp"><div class="hp-head"><h2>Sleep</h2><span class="hp-sub num">${avg!=null?`Avg ${hms(avg)}${avgScore!=null?' · score '+avgScore:''}`:'No data'}</span></div>
      <div class="sl-rows">${nights.map(n=>`<div class="sl-row${n.ds===td?' today':''}"><span class="d">${DOW[n.d.getDay()]}</span><div class="bar"><i style="width:${n.rec?Math.round(n.rec.totalSec/maxS*100):0}%"></i></div><span class="v num" title="${n.rec&&n.rec.score!=null?'Score '+n.rec.score:''}">${n.rec?hms(n.rec.totalSec):'—'}</span></div>`).join('')}</div>
    </section>
    <section class="hp"><div class="hp-head"><h2>${off===0?'Rest of week':'Sessions'}</h2></div>
      ${restList.length?`<div class="rw-list">${restList.map(({w,d})=>{ const dd=DISC[w.disc]||DISC.other;
        return `<button class="rw" data-open="${esc(w.id)}"><span style="color:${dd.color}">${w.race?IC.flag:(IC[w.disc]||IC.other)}</span><span class="t">${DOW[d.d.getDay()]} · ${esc(w.title)}</span><span class="m num">${+w.dist?fmtKm(w.dist,w.disc):(+w.dur?fmtDur(w.dur):'')}</span></button>`; }).join('')}</div>`
      :`<div class="empty">${off===0?'Nothing else planned this week.':'Nothing planned.'}</div>`}
    </section>`;
}
$('#week').addEventListener('click',e=>{
  const b=e.target.closest('[data-wk]');
  if(b){ const n=+b.dataset.wk; UI.weekStart=n===0?null:addDays(UI.weekStart||monday(new Date()),7*n); if(UI.weekStart&&iso(UI.weekStart)===iso(monday(new Date()))) UI.weekStart=null; renderWeek(); return; }

      const ops=[]; let skipped=0;
      for(const col of ['plans','library','workouts']) for(const [id,body] of Object.entries(d[col]||{})){
        if(!/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id)||!body||typeof body!=='object'){ skipped++; continue; }
        const clean={...body}; delete clean.id; ops.push([col,id,clean]);
      }
      setSaveState('Importing…');
      try{
        for(let i=0;i<ops.length;i+=400){ const b=writeBatch(fdb); ops.slice(i,i+400).forEach(([c,id,body])=>b.set(doc(fdb,'users',user.uid,c,id),body)); await b.commit(); }
        msg.style.color='var(--ink)'; msg.textContent=`Imported ${ops.length} item${ops.length===1?'':'s'}${skipped?`, ${skipped} skipped`:''}.`; msg.hidden=false;
      }catch(err){ msg.textContent='Import failed: '+err.message; msg.hidden=false; }
    });
  });
}
$('#btnSettings').addEventListener('click',openSettings);

/* ---------- sign-in & boot ---------- */
const provider=new GoogleAuthProvider();
const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
function showAuthErr(e){ const er=$('#authErr'); er.textContent='Sign-in failed ('+(e&&e.code||'unknown')+')'+(e&&e.message?': '+e.message:''); er.hidden=false; }
$('#btnSignIn').addEventListener('click',async()=>{
  $('#authErr').hidden=true;
  try{
    if(EMU){ await signInWithEmailAndPassword(auth,'dev@example.test','dev-password'); return; }
    if(standalone) await signInWithRedirect(auth,provider); else await signInWithPopup(auth,provider); }
  catch(e){
    if(e.code==='auth/popup-blocked'){ try{ await signInWithRedirect(auth,provider); return; }catch(e2){ showAuthErr(e2); return; } }
    if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request') showAuthErr(e);
  }
});
// Complete any pending redirect sign-in once on load. Keep the login screen hidden until both
// this and the first onAuthStateChanged have settled, so it doesn't flash after returning from Google.
let redirectSettled=false, authKnown=false;
function updateAuthScreens(){ if(!authKnown) return; $('#app').hidden=!user; $('#signin').hidden=!!user || !redirectSettled; }
getRedirectResult(auth).catch(showAuthErr).finally(()=>{ redirectSettled=true; updateAuthScreens(); });
let calPositioned=false;
onAuthStateChanged(auth,u=>{
  user=u; authKnown=true;
  updateAuthScreens();
  if(u){ startData(); showView(); loadWeather(false); if(currentView()==='calendar'&&!calPositioned){ calPositioned=true; requestAnimationFrame(()=>scrollToWeek(monday(new Date()),false)); } }
  else { stopData(); S.plans={}; S.library={}; S.workouts={}; SL.sleep=[]; SL.meta=null; }
});
window.addEventListener('hashchange',()=>{ if(currentView()==='calendar'&&!calPositioned){ calPositioned=true; requestAnimationFrame(()=>scrollToWeek(monday(new Date()),false)); } if(currentView()==='today') loadWeather(false); });
document.addEventListener('visibilitychange',()=>{
  if(document.hidden||!user) return;
  subReadiness(); // picks up the new day's score if the app stayed open overnight
  if(currentView()==='today'){ loadWeather(false); renderToday(); }
  else if(currentView()==='week') renderWeek();
});
})();
</script>
